<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doomsday Speed Games</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="crt-overlay" aria-hidden="true"></div>

    <div class="container">
        <header class="topbar">
            <div class="brand">
                <span class="logo">D</span>
                <h1>DOOM<span>SDAY</span></h1>
                <span class="tag">speed&nbsp;games</span>
            </div>
            <div class="header-controls">
                <a class="nav-link" href="index.html">▶ Practice</a>
            </div>
        </header>

        <main>
            <!-- Game selector -->
            <section id="gameMenu" class="game-menu">
                <button class="game-card" data-game="mod7">
                    <span class="game-num">GAME 01</span>
                    <h3>Mod 7 · 8→40</h3>
                    <p>A number from 8 to 40 flashes up. Answer its value mod 7. Builds the day-of-month reduction.</p>
                </button>
                <button class="game-card" data-game="month">
                    <span class="game-num">GAME 02</span>
                    <h3>Month Values</h3>
                    <p>A month flashes up. Recall its doomsday month value (0–6) as fast as you can.</p>
                </button>
                <button class="game-card" data-game="century">
                    <span class="game-num">GAME 03</span>
                    <h3>Century Anchors · 1500–2100</h3>
                    <p>A century (1500s–2100s) flashes up. Recall its anchor day value (0–6).</p>
                </button>
                <button class="game-card" data-game="combine">
                    <span class="game-num">GAME 04</span>
                    <h3>Combine</h3>
                    <p>A day (1–31), a month, and a century. Add them and give the offset mod 7. (No year term.)</p>
                </button>
            </section>

            <!-- Active game -->
            <div id="gamePlay" class="main-content" style="display: none;">
                <section class="cabinet">
                    <div class="cabinet-top">
                        <span id="gameTitle" class="game-title">Speed Game</span>
                        <button id="backToMenuBtn" class="back-btn">← Games</button>
                    </div>

                    <div id="promptDisplay" class="prompt-display">–</div>
                    <div id="promptSub" class="prompt-sub"></div>

                    <div class="num-grid">
                        <button class="num-btn" data-val="1">1</button>
                        <button class="num-btn" data-val="2">2</button>
                        <button class="num-btn" data-val="3">3</button>
                        <button class="num-btn" data-val="4">4</button>
                        <button class="num-btn" data-val="5">5</button>
                        <button class="num-btn" data-val="6">6</button>
                        <button class="num-btn" data-val="0" data-key="7">0</button>
                    </div>

                    <div id="feedback" class="feedback"></div>

                    <div class="keyboard-shortcuts">
                        <span class="shortcut"><kbd>1</kbd>–<kbd>6</kbd>, <kbd>7</kbd>/<kbd>0</kbd> Answer</span>
                        <span class="shortcut"><kbd>Esc</kbd> Back to games</span>
                    </div>
                </section>

                <aside class="stats-panel scoreboard">
                    <h3><span id="questionCounter">Attempts: 0</span></h3>
                    <div class="score-grid">
                        <div class="stat-item"><span class="stat-label">Attempts</span><span id="statAttempts">0</span></div>
                        <div class="stat-item"><span class="stat-label">Correct</span><span id="statCorrect">0</span></div>
                        <div class="stat-item accent-cyan"><span class="stat-label">Accuracy</span><span id="statAccuracy">0%</span></div>
                        <div class="stat-item accent-magenta"><span class="stat-label">Streak</span><span id="statStreak">0</span></div>
                        <div class="stat-item"><span class="stat-label">Fastest</span><span id="statFastest">-</span></div>
                        <div class="stat-item"><span class="stat-label">Average</span><span id="statAverage">-</span></div>
                        <div class="stat-item"><span class="stat-label">Last</span><span id="statLast">-</span></div>
                    </div>
                    <button id="resetStatsBtn" class="reset-stats-btn">Reset This Game</button>
                </aside>
            </div>
        </main>
    </div>

    <script src="speed.js"></script>
</body>
</html>
